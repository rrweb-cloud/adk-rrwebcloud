[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "adk-rrwebcloud"
version = "0.1.0"
description = "rrweb Cloud session replay integration for Google ADK browser runs"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [
  { name = "Justin" },
]
dependencies = [
  "google-adk>=1.0.0",
  "httpx>=0.27.0",
  "opentelemetry-api>=1.24.0",
  "pydantic>=2.7.0",
  "typing-extensions>=4.12.0",
]

[project.optional-dependencies]
dev = [
  "playwright>=1.52.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/adk_rrwebcloud"]

[tool.uv]
dev-dependencies = [
  "playwright>=1.52.0",
]
